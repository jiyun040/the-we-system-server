server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name the-we-erp.cloud www.the-we-erp.cloud;

    root /var/www/the-we-erp;
    index index.html;

    client_max_body_size 20m;

    location /static/ {
        alias /home/ubuntu/the-we-system-server/staticfiles/;
    }

    location /media/ {
        alias /home/ubuntu/the-we-system-server/media/;
    }

    # A missing frontend build previously made `/` point at the document root.
    # Nginx then returned its default 403 directory response.  Serve the SPA
    # when it exists, and otherwise expose the API health response so an empty
    # frontend directory never looks like a dead server.
    location = / {
        try_files /index.html @api_health;
    }

    # The frontend build may not include a favicon.  Return an empty response
    # instead of letting the request fall through to the SPA/API fallback.
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        try_files /favicon.ico =204;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location @api_health {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000/api/v1/health;
    }
}
